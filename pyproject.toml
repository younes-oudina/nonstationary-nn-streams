[project]
name = "nonstationary-nn-streams"
version = "0.1.0"
description = "Reproduction of 'Non-Stationary Learning of Neural Networks with Automatic Soft Parameter Reset' (Galashov et al., NeurIPS 2024)"
readme = "README.md"
authors = [
    { name = "Younes Oudina" },
    { name = "Adam Chgour" },
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/softresets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
